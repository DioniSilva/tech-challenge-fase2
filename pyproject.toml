[project]
name = "tech-challenge-fase-2"
version = "0.1.0"
description = "FIAP Phase 02 Tech Challenge baseline for purchase propensity prediction."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mlflow>=3.0.0,<4.0.0",
    "pandas>=2.3.1,<3.0.0",
    "scikit-learn>=1.7.1,<2.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "python-dotenv>=1.1.1,<2.0.0",
    "ucimlrepo>=0.0.7,<0.0.8",
]

[tool.poetry]
packages = [{ include = "purchase_propensity", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
dvc = ">=3,<4"
ruff = "^0.12.5"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "SIM", "UP"]
ignore = ["E501"]

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
